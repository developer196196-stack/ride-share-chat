openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: |
    Rideshare Chats API (NestJS, artifacts/api-nest).
    Auth: Firebase ID tokens via `Authorization: Bearer <token>`.
    Firestore and Storage are accessed only by the Nest Admin SDK — never by mobile clients.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Session bootstrap and the signed-in rider's profile (Firebase ID token)
  - name: validation
    description: Trip Validation Engine (telemetry, state)
  - name: rooms
    description: R.O.O.M. matchmaking, video access, chat history and ride summaries
  - name: preferences
    description: Language / translation preferences and trusted contacts
  - name: safety
    description: Live status share links, safety alerts and reports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status and whether Firebase Admin is configured
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/auth/bootstrap:
    post:
      operationId: bootstrapAuth
      tags: [auth]
      summary: Create or refresh the rider record after phone sign-in
      description: |
        Call right after Firebase phone verification succeeds. Creates `users/{uid}` on first
        sign-in (phone number is taken from the verified ID token, never from the body) and
        returns the rider profile. Safe to call repeatedly.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthBootstrapRequest"
      responses:
        "200":
          description: Rider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
  /v1/auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current rider profile
      description: Returns the profile for the Firebase UID in the Bearer ID token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Rider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No rider record yet — call bootstrapAuth first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
    patch:
      operationId: updateAuthMe
      tags: [auth]
      summary: Save the rider profile (Profile Setup screen)
      description: |
        Sets display name, home city, ride style, incognito shield and (optionally) the avatar
        uploaded via `createProfilePhotoUpload`. The profile counts as complete once display
        name, home city and ride style are all set.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRiderProfileRequest"
      responses:
        "200":
          description: Updated rider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiderProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No rider record yet — call bootstrapAuth first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
  /v1/auth/me/photo-upload:
    post:
      operationId: createProfilePhotoUpload
      tags: [auth]
      summary: Get a signed URL to upload a profile photo
      description: |
        Returns a short-lived signed Firebase Storage URL. PUT the image bytes to `uploadUrl`
        with the same `Content-Type`, then send `storagePath` as `photoStoragePath` in updateAuthMe.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePhotoUploadRequest"
      responses:
        "200":
          description: Signed upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhotoUpload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
  /v1/validation/telemetry:
    post:
      operationId: submitTelemetry
      tags: [validation]
      summary: Submit a Trip Validation telemetry sample
      description: |
        REST fallback for the `TELEMETRY` WebSocket event. Send GPS (Module 1), vibration
        FFT summary (Module 2) and OS activity (Module 3). Returns the rider's current
        validation snapshot. Recommended cadence: every 2 s before verification, 10 s in a R.O.O.M.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetrySample"
      responses:
        "200":
          description: Validation snapshot after applying the sample
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/validation/state:
    get:
      operationId: getValidationState
      tags: [validation]
      summary: Current Trip Validation state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Validation snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/validation/reset:
    post:
      operationId: resetValidation
      tags: [validation]
      summary: Start a new validation session (back to PENDING)
      description: Used after a session was TERMINATED, or to start a new ride.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fresh validation snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/vibes:
    get:
      operationId: listVibes
      tags: [rooms]
      summary: Live R.O.O.M. counts per vibe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: One entry per vibe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VibeStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/current:
    get:
      operationId: getCurrentRoom
      tags: [rooms]
      summary: The rider's current R.O.O.M. (if any)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current session, or `room = null`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentRoomResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a R.O.O.M. for a vibe
      description: |
        Requires validation state VERIFIED. The matchmaker places the rider in the fullest
        open R.O.O.M. for the vibe that contains nobody they recently skipped, or opens a new one.
        Returns the LiveKit connection details.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomRequest"
      responses:
        "200":
          description: Room session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Not VERIFIED (code `NOT_VERIFIED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/discover:
    get:
      operationId: listDiscoverRooms
      tags: [rooms]
      summary: Discovery Grid — up to 9 live R.O.O.M.s with open seats
      description: |
        Live rooms across all moods, fullest first, each with its host preview and occupancy.
        Skips the rider's own room and rooms with someone they skipped in the last 60 minutes.
        Listing works before verification; joining needs VERIFIED.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/host:
    post:
      operationId: hostRoom
      tags: [rooms]
      summary: Host a Room — open a new R.O.O.M. with the rider as moderator
      description: |
        Requires VERIFIED. Leaves the rider's current room (if any) and opens a new public room for
        the mood; matchmaking fills the other 8 seats.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostRoomRequest"
      responses:
        "200":
          description: Room session (the rider is the host)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >-
            `NOT_VERIFIED` (trip not verified), `ROOM_FULL`, `ROOM_UNAVAILABLE` (closed, or someone you
            skipped in the last 60 minutes is in it) or `MATCHMAKER_BUSY`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/{roomId}/join:
    post:
      operationId: joinRoomById
      tags: [rooms]
      summary: Join a specific R.O.O.M. from the Discovery Grid
      description: Requires VERIFIED. Leaves the rider's current room (if any) first.
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such room (code `ROOM_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            `NOT_VERIFIED` (trip not verified), `ROOM_FULL`, `ROOM_UNAVAILABLE` (closed, or someone you
            skipped in the last 60 minutes is in it) or `MATCHMAKER_BUSY`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/next:
    post:
      operationId: nextRoom
      tags: [rooms]
      summary: Instant Escape — skip to another R.O.O.M.
      description: |
        Leaves the current R.O.O.M., blocks its members from being matched with the rider for
        60 minutes, and joins another R.O.O.M. of the same vibe.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New room session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Not VERIFIED or not in a room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/leave:
    post:
      operationId: leaveRoom
      tags: [rooms]
      summary: Leave the current R.O.O.M. and end the ride session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ride summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/current/settings:
    patch:
      operationId: updateRoomSettings
      tags: [rooms]
      summary: Host controls — mood shift, automatic/manual matching, privacy lock
      description: |
        Host only. A new mood moves the room to that mood's matchmaking pool. The room is public
        (on the Discovery Grid and open to matchmaking) only while matching is `auto` and it is not
        locked. Everyone in the room gets `ROOM_SETTINGS_CHANGED`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomSettingsUpdate"
      responses:
        "200":
          description: Updated room session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the room's host can do this (code `NOT_HOST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not in a R.O.O.M. (code `NOT_IN_ROOM`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/current/members/{uid}/eject:
    post:
      operationId: ejectMember
      tags: [rooms]
      summary: Host — eject a rider
      description: Removes the rider from the room and video, and keeps them out of this room for the rest of its life (also through matchmaking). Their ride continues. They get `ROOM_EJECTED`.
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the room's host can do this (code `NOT_HOST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not in a R.O.O.M. (code `NOT_IN_ROOM`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: That rider isn't in your room (code `MEMBER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/current/members/{uid}/mute:
    post:
      operationId: muteMember
      tags: [rooms]
      summary: Host — force-mute a rider
      description: Mutes the rider’s microphone on the video server and sends them `FORCE_MUTED` ("The Host has muted your microphone."). They can unmute themselves later.
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the room's host can do this (code `NOT_HOST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not in a R.O.O.M. (code `NOT_IN_ROOM`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: That rider isn't in your room (code `MEMBER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/current/members/{uid}/flag:
    post:
      operationId: flagMember
      tags: [rooms]
      summary: Host — silently flag a rider for Trust & Safety
      description: Creates a moderation report (source `host_flag`) with recent room chat. Invisible to the flagged rider; the room carries on.
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagRequest"
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the room's host can do this (code `NOT_HOST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not in a R.O.O.M. (code `NOT_IN_ROOM`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: That rider isn't in your room (code `MEMBER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/users/{uid}:
    get:
      operationId: getUserProfile
      tags: [social]
      summary: Public profile with follow counts and your relationship
      description: Live room status is only included for friends (you follow each other).
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such rider (code `USER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/users/{uid}/follow:
    post:
      operationId: followUser
      tags: [social]
      summary: Follow a rider
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such rider (code `USER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: You cannot follow yourself (code `CANNOT_FOLLOW_SELF`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: unfollowUser
      tags: [social]
      summary: Unfollow a rider
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me/following:
    get:
      operationId: listFollowing
      tags: [social]
      summary: Riders you follow (friends who are riding now first)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/me/followers:
    get:
      operationId: listFollowers
      tags: [social]
      summary: Riders who follow you
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/current/invites:
    post:
      operationId: inviteToRoom
      tags: [social]
      summary: Host — invite someone from your network into your room
      description: |
        The invitee must follow you or be followed by you. They get `ROOM_INVITE`; the invite lasts
        10 minutes and lets them into the room even while it is Manual or locked (never past an
        ejection or a recent skip).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the room’s host can do this (code `NOT_HOST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such rider, or not in your network (code `NOT_IN_NETWORK`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not in a R.O.O.M. (code `NOT_IN_ROOM`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/{roomId}/requests:
    post:
      operationId: requestToJoinRoom
      tags: [social]
      summary: Ask a friend's private room for a seat
      description: Only for friends of the host (you follow each other) and only while the room is private. The host gets `ROOM_JOIN_REQUEST`.
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only friends of the host can ask (code `NOT_FRIENDS`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such room (code `ROOM_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`ROOM_PUBLIC` (just join it), `ROOM_FULL`, `ROOM_UNAVAILABLE` or `NOT_VERIFIED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/current/requests:
    get:
      operationId: listJoinRequests
      tags: [social]
      summary: Host — pending join requests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequestList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the room’s host can do this (code `NOT_HOST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not in a R.O.O.M. (code `NOT_IN_ROOM`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/current/requests/{uid}/accept:
    post:
      operationId: acceptJoinRequest
      tags: [social]
      summary: Host — accept a join request (sends the rider an invite)
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the room’s host can do this (code `NOT_HOST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such request (code `REQUEST_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not in a R.O.O.M. (code `NOT_IN_ROOM`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/current/requests/{uid}/decline:
    post:
      operationId: declineJoinRequest
      tags: [social]
      summary: Host — decline a join request
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the room’s host can do this (code `NOT_HOST`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Not in a R.O.O.M. (code `NOT_IN_ROOM`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rooms/current/messages:
    get:
      operationId: listRoomMessages
      tags: [rooms]
      summary: Recent chat messages in the current R.O.O.M. (translated for the caller)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/rides:
    get:
      operationId: listRides
      tags: [rooms]
      summary: The rider's recent validated rides (newest first)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Up to 20 rides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RideSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
  /v1/me/preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      summary: Language, translation, subtitle and safety preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences (defaults when never saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
    put:
      operationId: updatePreferences
      tags: [preferences]
      summary: Save preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
  /v1/me/trusted-contacts:
    get:
      operationId: listTrustedContacts
      tags: [preferences]
      summary: Trusted contacts for safety alerts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustedContact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
    post:
      operationId: createTrustedContact
      tags: [preferences]
      summary: Add a trusted contact (max 5)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustedContactInput"
      responses:
        "200":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustedContact"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
  /v1/me/trusted-contacts/{contactId}:
    delete:
      operationId: deleteTrustedContact
      tags: [preferences]
      summary: Remove a trusted contact
      security:
        - bearerAuth: []
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
  /v1/safety/share-links:
    post:
      operationId: createShareLink
      tags: [safety]
      summary: Create (or reuse) a live trip status link
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareLinkRequest"
      responses:
        "200":
          description: Share link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
  /v1/safety/alerts:
    post:
      operationId: createSafetyAlert
      tags: [safety]
      summary: Record a safety alert and get the message to send
      description: |
        Records the alert and returns a share link plus a ready-to-send message. In phase one the
        app opens the phone's own SMS / WhatsApp / email app pre-filled with it; nothing is sent
        by the server.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyAlertRequest"
      responses:
        "200":
          description: Alert recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyAlertResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
  /v1/public/share/{token}:
    get:
      operationId: getPublicShare
      tags: [safety]
      summary: Public live trip status (no auth)
      description: Powers the public status page at `/api/share/{token}`.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicShareStatus"
        "404":
          description: Unknown link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/reports:
    post:
      operationId: createReport
      tags: [safety]
      summary: Report a participant or R.O.O.M.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequest"
      responses:
        "200":
          description: Report recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/FirebaseUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  responses:
    Unauthorized:
      description: Missing or invalid Firebase ID token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required backend service (Redis, Firebase, LiveKit) is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FirebaseUnavailable:
      description: Firebase Admin is not configured on the server
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        firebaseConfigured:
          type: boolean
        redisConfigured:
          type: boolean
        livekitConfigured:
          type: boolean
        roadsConfigured:
          type: boolean
      required:
        - status
        - firebaseConfigured
        - redisConfigured
        - livekitConfigured
        - roadsConfigured
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g. AUTH_UNAUTHORIZED, VALIDATION_ERROR)
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - code
        - message
    RideStyle:
      type: string
      enum: [party_tech, networking, deep_talks, just_chilling]
      description: Vibe badge shown to other riders
    AuthBootstrapRequest:
      type: object
      properties:
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 of the dial code picked on the Authentication screen
          pattern: "^[A-Z]{2}$"
    RiderProfile:
      type: object
      properties:
        uid:
          type: string
        phoneNumber:
          type: ["string", "null"]
          description: E.164 number verified by Firebase
        countryCode:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        homeCity:
          type: ["string", "null"]
        rideStyle:
          oneOf:
            - $ref: "#/components/schemas/RideStyle"
            - type: "null"
        incognitoDropoff:
          type: boolean
        photoUrl:
          type: ["string", "null"]
          description: Short-lived signed download URL for the avatar
        profileComplete:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - uid
        - phoneNumber
        - countryCode
        - displayName
        - homeCity
        - rideStyle
        - incognitoDropoff
        - photoUrl
        - profileComplete
        - createdAt
        - updatedAt
    UpdateRiderProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 3
          maxLength: 24
          pattern: "^[A-Za-z0-9._]+$"
          description: Letters, numbers, dots and underscores
        homeCity:
          type: string
          minLength: 2
          maxLength: 60
        rideStyle:
          $ref: "#/components/schemas/RideStyle"
        incognitoDropoff:
          type: boolean
        photoStoragePath:
          type: string
          description: "`storagePath` returned by createProfilePhotoUpload"
      required:
        - displayName
        - homeCity
        - rideStyle
        - incognitoDropoff
    ProfilePhotoUploadRequest:
      type: object
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required:
        - contentType
    ProfilePhotoUpload:
      type: object
      properties:
        uploadUrl:
          type: string
        storagePath:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - uploadUrl
        - storagePath
        - expiresAt
    ValidationState:
      type: string
      description: POST_RIDE = the rider left the vehicle; the session stays live for the post-ride extension, then ends.
      enum: [PENDING, VERIFIED, GRACE, POST_RIDE, TERMINATED]
    ActivityType:
      type: string
      enum: [in_vehicle, on_bicycle, on_foot, walking, running, still, unknown]
    GpsReading:
      type: object
      description: Module 1 — one GPS fix
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        speedMps:
          type: ["number", "null"]
          description: OS-reported speed in m/s (null when unavailable)
        accuracyM:
          type: number
          minimum: 0
        timestamp:
          type: number
          description: Fix time, ms since epoch
        isMock:
          type: boolean
        lowPower:
          type: boolean
          description: >-
            Low-power network position sent while the app's battery saver is on. Used for the
            rider's live location only, never for speed or spoof checks.
      required: [lat, lng, speedMps, accuracyM, timestamp, isMock]
    VibrationReading:
      type: object
      description: Module 2 — summary of a 3-second FFT window
      properties:
        vehicleBandRatio:
          type: number
          minimum: 0
          maximum: 1
        dominantHz:
          type: number
          minimum: 0
        rmsMps2:
          type: number
          minimum: 0
        walkingScore:
          type: number
          minimum: 0
          maximum: 1
        shakeScore:
          type: number
          minimum: 0
          maximum: 1
        sampleRateHz:
          type: number
          minimum: 0
      required: [vehicleBandRatio, dominantHz, rmsMps2, walkingScore, shakeScore, sampleRateHz]
    ActivityReading:
      type: object
      description: Module 3 — OS activity recognition
      properties:
        type:
          $ref: "#/components/schemas/ActivityType"
        confidence:
          type: number
          minimum: 0
          maximum: 100
      required: [type, confidence]
    TelemetrySample:
      type: object
      properties:
        gps:
          $ref: "#/components/schemas/GpsReading"
        vibration:
          $ref: "#/components/schemas/VibrationReading"
        activity:
          $ref: "#/components/schemas/ActivityReading"
        device:
          type: object
          properties:
            isEmulator:
              type: boolean
            isRooted:
              type: boolean
        simulated:
          type: boolean
          description: Dev-only simulated ride (rejected unless the server allows it)
        preferredLanguage:
          type: string
          maxLength: 16
    ModuleScores:
      type: object
      properties:
        gps:
          type: ["number", "null"]
        vibration:
          type: ["number", "null"]
        groundTruth:
          type: ["number", "null"]
      required: [gps, vibration, groundTruth]
    ValidationSnapshot:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/ValidationState"
        score:
          type: number
        speedMph:
          type: number
        modules:
          $ref: "#/components/schemas/ModuleScores"
        checks:
          type: object
          properties:
            gpsSpeedLock:
              type: boolean
            vibration:
              type: ["boolean", "null"]
            groundTruth:
              type: ["boolean", "null"]
            onRoad:
              type: ["boolean", "null"]
          required: [gpsSpeedLock, vibration, groundTruth, onRoad]
        graceDeadline:
          type: ["string", "null"]
          format: date-time
        graceRemainingSec:
          type: ["number", "null"]
        postRideDeadline:
          type: ["string", "null"]
          format: date-time
          description: End of the post-ride extension (POST_RIDE only)
        postRideRemainingSec:
          type: ["number", "null"]
        terminationReason:
          type: ["string", "null"]
          enum: [spoof_detected, exited_vehicle, grace_expired, signal_lost, user_ended, null]
        thresholds:
          description: Active engine thresholds (configurable on the server via VALIDATION_* env)
          type: object
          properties:
            entryMph:
              type: number
            entrySustainSec:
              type: number
            graceMph:
              type: number
            graceDurationSec:
              type: number
            postRideDurationSec:
              type: number
            verifiedScore:
              type: number
          required: [entryMph, entrySustainSec, graceMph, graceDurationSec, postRideDurationSec, verifiedScore]
        updatedAt:
          type: string
          format: date-time
      required: [state, score, speedMph, modules, checks, graceDeadline, graceRemainingSec, postRideDeadline, postRideRemainingSec, terminationReason, thresholds, updatedAt]
    Vibe:
      type: string
      enum: [party_mode, networking, deep_talks, just_chilling]
    VibeStats:
      type: object
      properties:
        vibe:
          $ref: "#/components/schemas/Vibe"
        rooms:
          type: number
        riders:
          type: number
        openSeats:
          type: number
      required: [vibe, rooms, riders, openSeats]
    JoinRoomRequest:
      type: object
      properties:
        vibe:
          $ref: "#/components/schemas/Vibe"
      required: [vibe]
    RoomMember:
      type: object
      properties:
        uid:
          type: string
        displayName:
          type: string
        homeCity:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        isSelf:
          type: boolean
        isHost:
          type: boolean
          description: The room's moderator
      required: [uid, displayName, homeCity, photoUrl, isSelf, isHost]
    LiveKitConnection:
      type: object
      properties:
        url:
          type: string
        token:
          type: string
      required: [url, token]
    RoomSession:
      type: object
      properties:
        roomId:
          type: string
        vibe:
          $ref: "#/components/schemas/Vibe"
        capacity:
          type: number
        hostUid:
          type: ["string", "null"]
          description: The room's moderator (opened the room, or the longest-present rider after the host left)
        matching:
          $ref: "#/components/schemas/RoomMatching"
        locked:
          type: boolean
          description: Privacy Lock — closed to new riders until the host unlocks it
        members:
          type: array
          items:
            $ref: "#/components/schemas/RoomMember"
        livekit:
          description: Null when video is not configured on the server
          oneOf:
            - $ref: "#/components/schemas/LiveKitConnection"
            - type: "null"
        joinedAt:
          type: string
          format: date-time
      required: [roomId, vibe, capacity, hostUid, matching, locked, members, livekit, joinedAt]
    RoomMatching:
      type: string
      description: auto = matchmaking fills open seats; manual = the host curates (off the Discovery Grid)
      enum: [auto, manual]
    RoomSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        vibe:
          $ref: "#/components/schemas/Vibe"
        matching:
          $ref: "#/components/schemas/RoomMatching"
        locked:
          type: boolean
    ModerationResult:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    FlagRequest:
      type: object
      properties:
        note:
          type: ["string", "null"]
          maxLength: 500
    LiveRoom:
      type: object
      description: Where a friend is riding right now
      properties:
        roomId:
          type: string
        vibe:
          $ref: "#/components/schemas/Vibe"
        isHost:
          type: boolean
        memberCount:
          type: number
        capacity:
          type: number
        open:
          type: boolean
          description: Public with a free seat (join directly); otherwise ask the host
      required: [roomId, vibe, isHost, memberCount, capacity, open]
    SocialUser:
      type: object
      properties:
        uid:
          type: string
        displayName:
          type: string
        homeCity:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
        isFollowing:
          type: boolean
        followsYou:
          type: boolean
        live:
          description: Only for friends (mutual follows) who are in a R.O.O.M. right now
          oneOf:
            - $ref: "#/components/schemas/LiveRoom"
            - type: "null"
      required: [uid, displayName, homeCity, photoUrl, isFollowing, followsYou, live]
    SocialList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/SocialUser"
      required: [users]
    PublicProfile:
      allOf:
        - $ref: "#/components/schemas/SocialUser"
        - type: object
          properties:
            followerCount:
              type: number
            followingCount:
              type: number
          required: [followerCount, followingCount]
    FollowResult:
      type: object
      properties:
        following:
          type: boolean
        followerCount:
          type: number
      required: [following, followerCount]
    InviteRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
      required: [uid]
    JoinRequest:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/RoomHost"
        requestedAt:
          type: string
          format: date-time
      required: [user, requestedAt]
    JoinRequestList:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/JoinRequest"
      required: [requests]
    HostRoomRequest:
      type: object
      properties:
        vibe:
          $ref: "#/components/schemas/Vibe"
      required: [vibe]
    RoomHost:
      type: object
      properties:
        uid:
          type: string
        displayName:
          type: string
        homeCity:
          type: ["string", "null"]
        photoUrl:
          type: ["string", "null"]
      required: [uid, displayName, homeCity, photoUrl]
    DiscoverRoom:
      type: object
      properties:
        roomId:
          type: string
        vibe:
          $ref: "#/components/schemas/Vibe"
        memberCount:
          type: number
        capacity:
          type: number
        host:
          oneOf:
            - $ref: "#/components/schemas/RoomHost"
            - type: "null"
        createdAt:
          type: string
          format: date-time
      required: [roomId, vibe, memberCount, capacity, host, createdAt]
    DiscoverResponse:
      type: object
      properties:
        rooms:
          type: array
          maxItems: 9
          items:
            $ref: "#/components/schemas/DiscoverRoom"
        liveRooms:
          type: number
          description: All live rooms right now (including full ones)
      required: [rooms, liveRooms]
    CurrentRoomResponse:
      type: object
      properties:
        room:
          oneOf:
            - $ref: "#/components/schemas/RoomSession"
            - type: "null"
      required: [room]
    RideSummary:
      type: object
      properties:
        rideId:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        durationSec:
          type: number
        roomDurationSec:
          type: number
        distanceMiles:
          type: number
        avgMph:
          type: number
        peersMet:
          type: number
        graceCount:
          type: number
        graceSeconds:
          type: number
        vibe:
          oneOf:
            - $ref: "#/components/schemas/Vibe"
            - type: "null"
        endReason:
          type: string
      required: [rideId, startedAt, endedAt, durationSec, roomDurationSec, distanceMiles, avgMph, peersMet, graceCount, graceSeconds, vibe, endReason]
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        roomId:
          type: string
        senderId:
          type: string
        senderName:
          type: string
        text:
          type: string
          description: Text in the recipient's language
        original:
          type: string
        originalLanguage:
          type: ["string", "null"]
        translated:
          type: boolean
        targetLanguage:
          type: ["string", "null"]
        sentAt:
          type: string
          format: date-time
      required: [id, roomId, senderId, senderName, text, original, originalLanguage, translated, targetLanguage, sentAt]
    Preferences:
      type: object
      properties:
        nativeLanguage:
          type: string
          minLength: 2
          maxLength: 16
          description: BCP-47 language code, e.g. en, es, hi, zh-CN
        autoTranslate:
          type: boolean
        subtitleSize:
          type: string
          enum: [sm, md, lg]
        subtitleStyle:
          type: string
          enum: [bubble, subtitle]
        promptShareOnVerified:
          type: boolean
          description: Offer a one-tap "Share my trip" when the rider becomes VERIFIED
      required: [nativeLanguage, autoTranslate, subtitleSize, subtitleStyle, promptShareOnVerified]
    ContactChannel:
      type: string
      enum: [sms, whatsapp, email]
    TrustedContactInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        phone:
          type: ["string", "null"]
          description: E.164, required for sms / whatsapp
          pattern: "^\\+[1-9]\\d{6,14}$"
        email:
          type: ["string", "null"]
          maxLength: 254
          description: Required for email (validated server-side)
        channel:
          $ref: "#/components/schemas/ContactChannel"
      required: [name, phone, email, channel]
    TrustedContact:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        channel:
          $ref: "#/components/schemas/ContactChannel"
        createdAt:
          type: string
          format: date-time
      required: [id, name, phone, email, channel, createdAt]
    ShareLinkRequest:
      type: object
      properties:
        ttlMinutes:
          type: number
          minimum: 15
          maximum: 720
    ShareLink:
      type: object
      properties:
        token:
          type: string
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [token, url, expiresAt]
    GeoPoint:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        accuracyM:
          type: ["number", "null"]
      required: [lat, lng, accuracyM]
    SafetyAlertRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [share_status, emergency]
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
      required: [kind]
    SafetyAlertResult:
      type: object
      properties:
        alertId:
          type: string
        shareUrl:
          type: string
        message:
          type: string
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/TrustedContact"
      required: [alertId, shareUrl, message, contacts]
    PublicShareStatus:
      type: object
      properties:
        riderName:
          type: string
        active:
          type: boolean
        state:
          oneOf:
            - $ref: "#/components/schemas/ValidationState"
            - type: "null"
        speedMph:
          type: ["number", "null"]
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        updatedAt:
          type: ["string", "null"]
          format: date-time
        expiresAt:
          type: string
          format: date-time
      required: [riderName, active, state, speedMph, location, updatedAt, expiresAt]
    ReportRequest:
      type: object
      properties:
        roomId:
          type: ["string", "null"]
        reportedUid:
          type: ["string", "null"]
        reason:
          type: string
          enum: [harassment, nudity, hate, violence, minor, spam, other]
        details:
          type: ["string", "null"]
          maxLength: 1000
      required: [reason]
    ReportResult:
      type: object
      properties:
        id:
          type: string
      required: [id]
